# templates/publish.yml —— 复制到你的**数据仓库** .github/workflows/publish.yml
#
# 数据仓库布局（不含任何代码）：
#   trips/space.md              个人空间名片（+ 头像、打赏二维码，路径相对 space.md）
#   trips/<trip-id>/plan.md     行程；frontmatter 写 visibility: public 的进公开版
#   trips/<trip-id>/geometry.json   pnpm enrich 生成的路网缓存（可选）
#
# 推 main → 拉工具仓库（钉 tag）→ 校验 → 构建完整版 + 公开版两份产物 → 各发到一个 Cloudflare Pages 项目
#   公开版 → <CF_PROJECT_PUBLIC>.pages.dev，谁都能看（数据已抹过）
#   完整版 → <CF_PROJECT_FULL>.pages.dev，Cloudflare Access 挡在前面
# 两个都是 wrangler 直传项目：Cloudflare 只拿产物、拿不到源文件；数据仓库保持私有。
# （GitHub Pages 不用：Free 账号只能给公开仓库开 Pages，而这个仓库里是完整版行程。）
# 不要完整站的话，删掉最后那一步即可；步骤说明见工具仓库 docs/PUBLISHING.md。
name: Publish personal space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只跑一个部署，后来的顶掉排队中的
concurrency:
  group: publish
  cancel-in-progress: true

env:
  # 升级工具 = 改这一行（用工具仓库的 tag；钉死版本，工具仓库推了新代码不会悄悄改变你的站）
  JJJ_TOOL_REF: v0.2.0
  JJJ_DATA_DIR: ${{ github.workspace }}/trips

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the tool
        uses: actions/checkout@v4
        with:
          repository: HelloworldHarley/just-j-journey
          ref: ${{ env.JJJ_TOOL_REF }}
          path: tool

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tool/package.json

      # Node ≥ 22.18：vite.config.ts 引用 workspace 包的 .ts 入口，靠 Node 原生剥类型执行；20 上会 ERR_UNKNOWN_FILE_EXTENSION
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tool/pnpm-lock.yaml

      - run: pnpm -C tool install --frozen-lockfile

      # 解析器是唯一校验器：plan.md / space.md 写坏了在这里停，什么都不发
      - name: Validate TripMD and space.md
        run: pnpm -C tool data:check

      # 两份产物都挂在各自项目的根路径下，不用 --base
      - name: Build the full site
        run: pnpm -C tool build

      # 抹除后结构块里仍有敏感值会直接构建失败；正文里的命中只是警告，去日志里过目
      - name: Build the public site
        run: pnpm -C tool build:public

      # 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID；Variables：CF_PROJECT_PUBLIC、CF_PROJECT_FULL
      - name: Deploy the public site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy tool/apps/web/dist-public --project-name=${{ vars.CF_PROJECT_PUBLIC }} --branch=main

      # ── 完整版（不要完整站就删掉这一步）──────────────────────────────────
      - name: Deploy the full site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy tool/apps/web/dist --project-name=${{ vars.CF_PROJECT_FULL }} --branch=main
