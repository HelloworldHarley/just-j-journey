# 推 main → 校验 TripMD → 构建 → 发布到 GitHub Pages。
# 首次使用需在仓库 Settings → Pages 把 Source 设为 "GitHub Actions"。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，后来的顶掉排队中的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本读 package.json 的 packageManager

      # Node ≥ 22.18：vite.config.ts 引用 workspace 包的 .ts 入口，靠 Node 原生剥类型执行；20 上会 ERR_UNKNOWN_FILE_EXTENSION
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # vite build 只做转译不查类型 —— 不跑这步的话，类型错误会一路绿灯上线
      - name: Typecheck
        run: pnpm typecheck

      - name: Validate TripMD fixtures
        run: pnpm data:check

      - name: Run tests
        run: pnpm test

      # 地图 worker 的两层历史坑要在两种产物上都重放；CI 没有 Chromium，浏览器层明确报跳过
      - name: Built-map gate, full and public
        run: pnpm check:built && pnpm check:built --public

      # 这个仓库的 Pages 是工具演示站，发的是**公开版**产物：示范行程本身就是抹过的公开版，
      # 用完整版界面画它会满屏「待填」、带着待办与日历订阅 —— 那是给作者的界面。
      # build:public 只收 visibility: public、不带 `_` 的行程，示范目录天然不进产物。
      # 项目页挂在 https://<user>.github.io/<repo>/ 下
      - name: Public build
        run: pnpm build:public --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist-public

      - id: deployment
        uses: actions/deploy-pages@v4
